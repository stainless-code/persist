# Version PRs from `changesets/action` use head branch `changeset-release/<base>` (e.g. `changeset-release/main`);
# see changesets/action `run.ts`: `versionBranch = \`changeset-release/${branch}\``.
#
# GitHub docs: required status checks may be successful, skipped, or neutral — skipped often still allows merge
# (see https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-protected-branches/about-protected-branches#require-status-checks-before-merging ).
# This workflow still gates on `changeset-release/*` and finishes with one **`CI complete`** job so there is a
# single unambiguous pass/fail (branch protection also warns that duplicate job *names* across workflows can block merges).
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# CI jobs are read-only; the Release workflow carries its own elevated
# `permissions` (contents / pull-requests / id-token) — this default doesn't
# extend to it.
permissions:
  contents: read

jobs:
  skip-ci:
    name: Gate (skip full CI for version PRs?)
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      - id: gate
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && \
             echo "${{ github.head_ref }}" | grep -q '^changeset-release/'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Head is changeset-release/* — full CI skipped; ci-complete will pass."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  format:
    name: 💅 Format
    needs: skip-ci
    if: needs['skip-ci'].outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run format
        run: bun run format:check

  lint:
    name: 🕵 Lint
    needs: skip-ci
    if: needs['skip-ci'].outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run lint
        run: bun run lint:ci

  typecheck:
    name: ✅ Typecheck
    needs: skip-ci
    if: needs['skip-ci'].outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run typecheck
        run: bun run typecheck

  test:
    name: 🔬 Test
    needs: skip-ci
    if: needs['skip-ci'].outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run unit tests with coverage gate
        run: bun run test:coverage

  test-dom:
    name: 🌐 Test (DOM)
    needs: skip-ci
    if: needs['skip-ci'].outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run React reactivity tests (vitest + jsdom)
        run: bun run test:dom

  build:
    name: 🧰 Build
    needs: skip-ci
    if: needs['skip-ci'].outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run build
        run: bun run build

  check-pack:
    name: 📦 Pack validation
    needs: [skip-ci, build]
    if: needs['skip-ci'].outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build
        run: bun run build

      - name: Run pack validation
        run: bun run check:pack

  size:
    name: 📏 Bundle size
    needs: [skip-ci, build]
    if: needs['skip-ci'].outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build
        run: bun run build

      - name: Run size limit
        run: bun run size

  docs:
    name: 📖 Docs site
    needs: skip-ci
    if: needs['skip-ci'].outputs.skip != 'true'
    runs-on: ubuntu-latest
    # Token for github-releases changelog — avoids offline changelog failures under --strict.
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Sitemap lastmod uses `git log` per file.
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      # Lib dist — cheap; keep for parity / future islands that resolve package entrypoints.
      - name: Build
        run: bun run build

      - name: Generate API reference (Markdown)
        run: bun run docs:api

      # Site content graph. No --external (offline).
      - name: Validate docs links
        run: bun run docs:validate -- --strict

      - name: Typecheck docs site
        run: bun run docs:check -- --isolated

      - name: Build docs site
        run: bun run docs:build

      # Post-build; skips live in apps/docs `audit` script (+ lessons).
      - name: Audit docs site
        run: bun run docs:audit

  dedupe:
    name: 🧹 Dedupe
    needs: skip-ci
    if: needs['skip-ci'].outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: bun dedupe --check
        run: bun run dedupe:check

  audit:
    # `bun audit` exits 0 regardless of severity — the scan below decides.
    # An advisory-API outage doesn't block; malware is out of scope
    # (provenance + frozen lockfile cover that).
    name: 🛡 Audit
    needs: skip-ci
    if: needs['skip-ci'].outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: bun audit (block on high/critical)
        # Blume image-size + braces/node-forge have no published fix; the latter reach
        # only via expo/React Native dev tooling, never the published tarball.
        # Reassess on every expo/Blume bump; any other high/critical still blocks.
        # Docs/dev-only transitives, likewise no src/ or tarball reach — ignored, not overridden:
        # dompurify + sharp + undici + astro's zod + MCP SDK/body-parser via Blume
        # (+ MCP SDK/body-parser/zod via @stainless-code/codemap devDep — evidence script only),
        # markdown-it via typedoc, launch-editor + shell-quote via changesets.
        run: |
          set +e
          # bun emits ANSI color even when piped — strip it or the severity grep misses it.
          NO_COLOR=1 bun audit --ignore=GHSA-w3rx-r6r6-pgpr --ignore=GHSA-5p2g-fcmc-qvqq --ignore=GHSA-vfj7-8cjw-p6xm --ignore=GHSA-86w9-cpqp-85rv --ignore=GHSA-cg2g-xh64-v4q7 --ignore=GHSA-mrv2-3pqr-j5jr --ignore=GHSA-587h-7wmj-h5pm --ignore=GHSA-pqg4-j6r4-53mv --ignore=GHSA-gfr2-rv44-r23c --ignore=GHSA-r7fv-28h4-cvq7 --ignore=GHSA-wq5f-xc86-pv6w --ignore=GHSA-xjj6-f33q-929c --ignore=GHSA-mrhx-c7xc-m3w5 --ignore=GHSA-6qxp-vccf-f47h --ignore=GHSA-22jm-h49p-29qw --ignore=GHSA-46jr-4wx8-v453 --ignore=GHSA-27r3-jxmh-p828 2>&1 | sed -E 's/\x1b\[[0-9;]*m//g' > /tmp/bun-audit.log
          cat /tmp/bun-audit.log
          if grep -E '(^|[[:space:]])(high|critical):[[:space:]]' /tmp/bun-audit.log; then
            echo "::error::high or critical vulnerabilities found — blocking"
            exit 1
          fi

  ci-complete:
    name: CI complete
    needs:
      [
        skip-ci,
        format,
        lint,
        typecheck,
        test,
        test-dom,
        build,
        check-pack,
        size,
        docs,
        audit,
        dedupe,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed
        if: |
          needs['skip-ci'].outputs.skip != 'true' && (
            needs.format.result != 'success' ||
            needs.lint.result != 'success' ||
            needs.typecheck.result != 'success' ||
            needs.test.result != 'success' ||
            needs['test-dom'].result != 'success' ||
            needs.build.result != 'success' ||
            needs['check-pack'].result != 'success' ||
            needs.size.result != 'success' ||
            needs.docs.result != 'success' ||
            needs.audit.result != 'success' ||
            needs.dedupe.result != 'success'
          )
        run: exit 1

      - name: OK
        run: echo "CI requirements satisfied"
